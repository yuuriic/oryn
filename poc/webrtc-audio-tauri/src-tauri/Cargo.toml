[package]
name = "oryn-poc-webrtc-audio-tauri"
version = "0.0.0"
description = "POC-01B: áudio WebRTC loopback no Tauri 2 / WebView2 (descartável)"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# Sem plugins: o áudio usa apenas APIs WebRTC/Web Audio nativas do WebView2.
tauri = { version = "=2.12.5", features = [] }
